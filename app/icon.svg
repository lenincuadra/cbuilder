<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- warm near-black tile -->
  <rect width="64" height="64" rx="14" fill="#17140f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#332c21" stroke-width="1.5"/>

  <!-- CV pages (the document being tracked) -->
  <g stroke="#17140f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- sheet behind (stack hint) -->
    <path d="M22 17 H38 L46 25 V52 H22 Z" transform="rotate(-12 33 34)" fill="#d8ccb2"/>
    <!-- front sheet -->
    <g transform="rotate(-4 32 33)">
      <path d="M20 15 H37 L46 24 V51 H20 Z" fill="#f5efe1"/>
      <path d="M37 15 V24 H46 Z" fill="#e0d5bd"/>
      <path d="M25 31 H41 M25 37 H41 M25 43 H34" stroke-width="2.3"/>
    </g>
  </g>

  <!-- magnifying glass (the tracking) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="46" y1="46" x2="56" y2="56" stroke="#17140f" stroke-width="8.5"/>
    <line x1="46" y1="46" x2="56" y2="56" stroke="#f5efe1" stroke-width="5"/>
    <circle cx="39" cy="40" r="10.5" fill="#c4cace" fill-opacity="0.5"/>
    <circle cx="39" cy="40" r="10.5" stroke="#17140f" stroke-width="7.5"/>
    <circle cx="39" cy="40" r="10.5" stroke="#f5efe1" stroke-width="3.5"/>
    <path d="M33 35 q3 -2.5 6.5 -0.5" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.8"/>
  </g>
</svg>
